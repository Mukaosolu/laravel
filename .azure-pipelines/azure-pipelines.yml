trigger:
  branches:
    include:
      - 12.x

pool:
  name: Default
  demands:
    - agent.os -equals Windows_NT

variables:
  phpVersion: '8.2'
  repoName: '$(Build.Repository.Name)'                           # e.g., Online-Banking-System
  appFolder: '$(Build.Repository.Name)'
  stagingFolder: 'C:\temp\staging\$(Build.Repository.Name)'
  targetFolder: 'C:\$(Build.Repository.Name)'
  appPoolName: '$(Build.Repository.Name)-pool'

steps:
  - checkout: self

  - script: |
      php -v
    displayName: '✅ Verify PHP Installation'

  - script: |
      echo "Installing Composer..."
      php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
      php composer-setup.php
      php -r "unlink('composer-setup.php');"
      php composer.phar --version
    displayName: '✅ Install Composer'

  - script: |
      echo "Installing Laravel dependencies..."
      php composer.phar install --no-interaction --prefer-dist
      copy .env.example .env
      php artisan key:generate
    displayName: '✅ Install Laravel dependencies'

  - script: |
      echo "Creating $(appFolder) directory and copying files..."
      mkdir "$(Build.ArtifactStagingDirectory)\$(appFolder)"
      robocopy . "$(Build.ArtifactStagingDirectory)\$(appFolder)" /E /NFL /NDL /NJH /NJS /NC
      powershell -Command "Compress-Archive -Path '$(Build.ArtifactStagingDirectory)\$(appFolder)\*' -DestinationPath '$(Build.ArtifactStagingDirectory)\$(appFolder).zip'"
      rmdir /s /q "$(Build.ArtifactStagingDirectory)\$(appFolder)"
    displayName: '✅ Package $(appFolder)'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'
    displayName: '📦 Publish build artifacts'

  - task: DownloadPipelineArtifact@2
    inputs:
      artifactName: 'drop'
      targetPath: '$(Pipeline.Workspace)/app'
    displayName: '📥 Download Build Artifact'

  - task: CmdLine@2
    displayName: '🚀 Deploy to IIS + Configure'
    inputs:
      script: |
        set stagingFolder=$(stagingFolder)
        set targetFolder=$(targetFolder)
        set siteName=$(repoName)
        set appPoolName=$(appPoolName)
        set phpCgiPath=C:\xampp2\php\php-cgi.exe
        set artifactZip=$(Pipeline.Workspace)\app\$(appFolder).zip

        echo "📁 Creating staging directory..."
        if not exist "%stagingFolder%" mkdir "%stagingFolder%"

        echo "📦 Unzipping artifact to staging..."
        powershell -NoProfile -Command "Expand-Archive -Path '%artifactZip%' -DestinationPath '%stagingFolder%' -Force"

        echo "📁 Creating target directory..."
        if not exist "%targetFolder%" mkdir "%targetFolder%"

        echo "📤 Copying from staging to IIS folder..."
        robocopy "%stagingFolder%" "%targetFolder%" /E /MIR

        echo "🌐 Creating App Pool (if not exists)..."
        %windir%\system32\inetsrv\appcmd list apppool "%appPoolName%" || %windir%\system32\inetsrv\appcmd add apppool /name:"%appPoolName%"

        echo "🌐 Creating IIS Site (if not exists)..."
        %windir%\system32\inetsrv\appcmd list site "%siteName%" || %windir%\system32\inetsrv\appcmd add site /name:"%siteName%" /bindings:http/*:8000: /physicalPath:"%targetFolder%\public"

        echo "🔗 Linking site to app pool..."
        %windir%\system32\inetsrv\appcmd set app "%siteName%/" /applicationPool:"%appPoolName%"

        echo "⚙️ Configuring FastCGI for PHP..."
        %windir%\system32\inetsrv\appcmd set config -section:system.webServer/fastCgi /+"[fullPath='%phpCgiPath%']" /commit:apphost

        echo "🔐 Setting folder and file permissions..."
        icacls "%targetFolder%" /grant IIS_IUSRS:F /T
        icacls "%targetFolder%" /grant IUSR:F /T
        icacls "%targetFolder%" /grant "NETWORK SERVICE":F /T
        icacls "%targetFolder%\public\index.php" /grant IIS_IUSRS:F

        echo "♻️ Recycling App Pool..."
        %windir%\system32\inetsrv\appcmd recycle apppool /apppool.name:"%appPoolName%"

        echo "📦 Running Laravel optimize & migrate..."
        cd "%targetFolder%"
        php artisan config:cache
        php artisan view:cache
        php artisan migrate --force
